{% extends "base.html" %}
{% block title %}仪表盘 - RBAC{% endblock %}
{% block content %}
<div class="row mb-4">
    <div class="col">
        <h4><i class="bi bi-speedometer2"></i> 仪表盘</h4>
    </div>
</div>

<div class="row g-3" id="statsRow">
    <div class="col-md-3">
        <div class="card stat-card" style="border-left-color: #0d6efd;">
            <div class="stat-number" id="statUsers">—</div>
            <div class="stat-label">用户总数</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card" style="border-left-color: #198754;">
            <div class="stat-number" id="statRoles">—</div>
            <div class="stat-label">角色总数</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card" style="border-left-color: #ffc107;">
            <div class="stat-number" id="statFiles">—</div>
            <div class="stat-label">文件总数</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card" style="border-left-color: #dc3545;">
            <div class="stat-number" id="statLogs">—</div>
            <div class="stat-label">操作记录</div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col">
        <div class="card p-3">
            <h5 class="mb-3"><i class="bi bi-clock-history"></i> 最近操作</h5>
            <div id="recentLogs">
                <p class="text-muted">加载中...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
