{% extends "base.html" %}
{% block title %}登录 - RBAC{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill display-4 text-primary"></i>
                <h3 class="mt-2">RBAC 资源管理器</h3>
                <p class="text-muted">请登录以继续</p>
            </div>
            <div id="loginError" class="alert alert-danger d-none"></div>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" placeholder="输入用户名" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" placeholder="输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right"></i> 登录
                </button>
            </form>
            <p class="text-center text-muted mb-0">
                还没有账号？<a href="/register">立即注册</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
