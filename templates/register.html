{% extends "base.html" %}
{% block title %}注册 - RBAC{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill display-4 text-success"></i>
                <h3 class="mt-2">创建账号</h3>
                <p class="text-muted">注册为新用户（默认 Viewer 角色）</p>
            </div>
            <div id="registerError" class="alert alert-danger d-none"></div>
            <form id="registerForm">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" placeholder="3-50个字符，字母/数字/下划线" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">邮箱</label>
                    <input type="email" class="form-control" id="email" placeholder="可选">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" placeholder="至少8位，含大小写字母和数字" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">确认密码</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="再次输入密码" required>
                </div>
                <button type="submit" class="btn btn-success w-100 mb-3">
                    <i class="bi bi-check-lg"></i> 注册
                </button>
            </form>
            <p class="text-center text-muted mb-0">
                已有账号？<a href="/login">立即登录</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
